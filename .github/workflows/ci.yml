name: ci
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libsctp-dev
      - name: ci_local
        run: ./scripts/ci_local.sh
